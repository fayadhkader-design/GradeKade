[project]
name = "gradekade-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "opencv-python-headless>=4.11,<5",
  "pymupdf>=1.25,<2", "httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"
]
[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
