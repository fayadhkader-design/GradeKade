name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gradekade
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gradekade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradekade"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://gradekade:ci-only@localhost:5432/gradekade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/check.sh
      - run: npm run format:check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
