services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gradekade
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: gradekade
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gradekade']
      interval: 3s
      retries: 10
volumes:
  pgdata:
